<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#131315" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Blink Chat</title>
    <style>
      /* First paint, before React and index.css exist. Everything here is
         self-contained so startup never shows a bare spinner or unstyled text. */
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #f4f4f5;
        background: radial-gradient(120% 120% at 50% 0%, #1c2230 0%, #131315 58%);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #boot-fallback .boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }
      #boot-fallback .boot-logo {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        box-shadow: 0 18px 38px rgb(0 0 0 / 45%);
        animation: boot-breathe 2.4s ease-in-out infinite;
      }
      #boot-fallback .boot-name {
        margin: 0;
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #boot-fallback .boot-tag {
        margin: 0;
        color: #989fab;
        font-size: 0.85rem;
      }
      #boot-fallback .boot-bars {
        display: flex;
        gap: 6px;
        height: 26px;
        margin-top: 8px;
        align-items: flex-end;
      }
      #boot-fallback .boot-bars span {
        width: 6px;
        height: 26px;
        border-radius: 999px;
        background: #4b8eff;
        animation: boot-bounce 1.1s ease-in-out infinite;
      }
      #boot-fallback .boot-bars span:nth-child(2) { animation-delay: 0.15s; opacity: 0.78; }
      #boot-fallback .boot-bars span:nth-child(3) { animation-delay: 0.3s; opacity: 0.55; }
      @keyframes boot-bounce {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }
      @keyframes boot-breathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.02); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-fallback .boot-logo,
        #boot-fallback .boot-bars span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="boot-fallback" aria-busy="true" aria-live="polite">
        <div class="boot-card">
          <img class="boot-logo" src="/logo.svg" alt="" />
          <h1 class="boot-name">Blink</h1>
          <p class="boot-tag">Warming up your conversations…</p>
          <div class="boot-bars" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
